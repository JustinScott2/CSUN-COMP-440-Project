<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.8">
        <title>Comp 440 Project - Phase 1</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div id="injected-react-content"></div>

        <script src="https://unpkg.com/react@16/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
        <script>
            window.dbPromise = initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            })
            .then(SQL => {
                window.SQL = SQL;
                window.db = new SQL.Database();
                 //tables res ipsa loquitur
                //TODO delete the table users and use Users2, but rename it to Users, and update references accordingly
                window.db.run(`
                    CREATE TABLE IF NOT EXISTS users (
                        username TEXT PRIMARY KEY,
                        password TEXT,
                        firstName TEXT,
                        lastName TEXT,
                        email TEXT,
                        phone TEXT
                    );
                    
                    CREATE TABLE IF NOT EXISTS Users2(
                        username TEXT PRIMARY KEY,
                        password TEXT, --remember, this should be hashed,
                        firstName TEXT,
                        lastName TEXT,
                        email TEXT,
                        phoneNum TEXT
                    );  
                    
                    CREATE TABLE IF NOT EXISTS Admins(
                        username TEXT PRIMARY KEY,
                        password TEXT, --remember, this IS hashed,
                        FOREIGN KEY (username) REFERENCES Users2(username),
                        FOREIGN KEY (password) REFERENCES Users2(password)
                    );  
                    
                    CREATE TABLE IF NOT EXISTS Products(
                        itemID INT PRIMARY KEY,
                        title TEXT,
                        description TEXT,
                        seller TEXT,
                        datePosted DATE,
                        price INT, --last two values are cents, ie $2.50 is 250
                        FOREIGN KEY (seller) REFERENCES Users2(username)
                    );

                    CREATE TABLE IF NOT EXISTS Reviews(
                        itemID INT PRIMARY KEY,
                        poster TEXT,
                        revTitle TEXT,
                        revText TEXT,
                        rating INT,
                        datePosted DATE,
                        FOREIGN KEY (itemID) REFERENCES Products(itemID),
                        FOREIGN KEY (poster) REFERENCES Users2(username)
                    );

                    CREATE TABLE IF NOT EXISTS CategoryList(
                        categoryName TEXT PRIMARY KEY
                    );
                    
                    CREATE TABLE IF NOT EXISTS CategoryRelations(
                        itemID INT,
                        categoryName TEXT,
                        PRIMARY KEY (itemID, categoryName),
                        FOREIGN KEY (itemID) REFERENCES Products(itemID),
                        FOREIGN KEY (categoryName) REFERENCES CategoryList(categoryName)
                    );  
                `);

                window.db.run('INSERT INTO users (username, password, firstName, lastName, email, phone) VALUES ("RRanom", "Pass", "Justin", "Scott", "Justin.Scott.216@my.cusn.edu", "111-111-1111")');
                window.db.run('INSERT INTO users (username, password, firstName, lastName, email, phone) VALUES ("Reddd", "Pass", "Riley", "White", "riley.white.387@my.csun.edu", "111-111-1111")');
                return window.db;
            })
            .catch(err => {
                console.error('Failed to load sql.js', err);
                throw err;
            });
        </script>

        <script src="account.js"></script>
        <script type="text/babel" src="app.js"></script>
        <script type="text/babel">
            window.dbPromise
                .then(() => ReactDOM.render(React.createElement(Form), document.getElementById('injected-react-content')))
                .catch(err => {
                    console.error('DB failed to load', err);
                    ReactDOM.render(React.createElement(Form), document.getElementById('injected-react-content'));
                });
        </script>
    </body>
</html>
