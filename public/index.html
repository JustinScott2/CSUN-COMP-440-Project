<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.8">
        <title>Bibloguesser - 0.9</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div id="injected-react-content"></div>

        <script src="https://unpkg.com/react@16/umd/react.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.production.min.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6.26.0/babel.min.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
        <script>
            window.dbPromise = initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            })
            .then(SQL => fetch('dictionary.db')
                .then(res => {
                    if (!res.ok) {
                        throw new Error('Failed to fetch dictionary.db: ' + res.status);
                    }
                    return res.arrayBuffer();
                })
                .then(buf => {
                    window.SQL = SQL;
                    window.db = new SQL.Database(new Uint8Array(buf));
                    window.db2 = new SQL.Database();
                    window.db2.run(`
                        CREATE TABLE IF NOT EXISTS myWords (
                            Word TEXT,
                            Count INTEGER,
                            POS TEXT,
                            Definition TEXT,
                            NumWrong INTEGER,
                            NumRight INTEGER,
                            PRIMARY KEY (Word, Count, POS, Definition)
                        );
                    `);
                    return window.db;
                })
            )
            .catch(err => {
                console.error('Failed to load dictionary.db', err);
                throw err;
            });
            window.dbPromise3 = initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            }).then(SQL => fetch('DailyWords.db')
                .then(res => {if (!res.ok) { throw new Error('Failed to fetch DailyWords.db: ' + res.status);} return res.arrayBuffer();})
                .then(buf => { window.SQL = SQL; window.db3 = new SQL.Database(new Uint8Array(buf)); return window.db3; }))
                .catch(err => {console.error('Failed to load DailyWords.db', err); throw err;});
        </script>

        <script src="QnA.js"></script>
        <script src="localDB.js"></script>
        <script type="text/babel" src="app.js"></script>
        <script type="text/babel">
            window.dbPromise
                .then(() => ReactDOM.render(React.createElement(Form), document.getElementById('injected-react-content')))
                .catch(err => {
                    console.error('DB failed to load', err);
                    ReactDOM.render(React.createElement(Form), document.getElementById('injected-react-content'));
                });
        </script>
    </body>
</html>
